<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LeadForge AI — LinkedIn Auto-Pilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: #090d16; color: #f1f5f9; padding: 16px; font-size: 13px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: #38bdf8; }
    .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
    .status-on { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .status-off { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stat-box { background: #172033; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; text-align: center; }
    .stat-num { font-size: 18px; font-weight: 800; color: #38bdf8; font-family: monospace; }
    .stat-label { font-size: 10px; color: #94a3b8; margin-top: 2px; }

    .switch-wrap { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .switch-label { font-weight: 600; font-size: 12px; }

    .btn { display: block; width: 100%; border: none; border-radius: 8px; padding: 9px; font-weight: 600; font-size: 12px; cursor: pointer; text-align: center; transition: all 0.2s; margin-top: 6px; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #0ea5e9); color: white; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-accent { background: linear-gradient(135deg, #059669, #10b981); color: white; }
    .btn-accent:hover { opacity: 0.9; }
    .btn-secondary { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-secondary:hover { background: #334155; color: white; }

    .input-label { font-size: 10px; color: #64748b; margin-bottom: 4px; display: block; }
    .input-field { width: 100%; background: #090d16; border: 1px solid #334155; border-radius: 6px; padding: 6px 8px; color: white; font-size: 11px; }

    .footer { text-align: center; font-size: 10px; color: #64748b; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>⚡ LeadForge AI</span>
    </div>
    <span id="status-pill" class="status-badge status-on">● AUTO ACTIVE</span>
  </div>

  <div class="card">
    <div class="switch-wrap">
      <span class="switch-label">Autonomous Auto-Pilot</span>
      <input type="checkbox" id="toggle-autopilot" checked style="width: 18px; height: 18px; cursor: pointer;">
    </div>
    <p style="font-size: 11px; color: #94a3b8; line-height: 1.4;">
      Automatically warms up profiles & posts technical comments while your browser is open.
    </p>
  </div>

  <div class="grid">
    <div class="stat-box">
      <div class="stat-num" id="stat-views">0</div>
      <div class="stat-label">👀 Profile Views Today</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-comments">0</div>
      <div class="stat-label">💬 Comments Today</div>
    </div>
  </div>

  <button id="btn-trigger-view" class="btn btn-primary">🚀 Run Profile Warm-Up Now</button>
  <button id="btn-trigger-comment" class="btn btn-accent">💬 Post 1-Click AI Comment Now</button>
  <button id="btn-open-dashboard" class="btn btn-secondary">🌐 Open LeadForge Dashboard</button>

  <div class="card" style="margin-top: 12px; padding: 8px 12px;">
    <span class="input-label">LeadForge Server Endpoint:</span>
    <input type="text" id="server-url-input" class="input-field" value="https://leadsflow.snwebkarma.in">
  </div>

  <div class="footer">
    <span>LeadForge v1.1 • Live Server Synchronized</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
